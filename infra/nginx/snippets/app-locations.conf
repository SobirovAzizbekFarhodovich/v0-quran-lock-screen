# API/app locations shared by the HTTP (:80) and HTTPS (:443) servers.
# Included from nginx.conf and templates/https.conf.template.

location = /healthz {
  proxy_pass http://api_gateway/healthz;
}

# Deep health: postgres, redis, ai-rag and the recitation model. 503 when
# any of them is degraded (used by the CD deploy and the health monitor).
location = /healthz/deep {
  limit_req zone=api burst=5 nodelay;
  proxy_pass http://api_gateway/healthz/deep;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 20s;
}

# Prometheus scrapes api-gateway:8080 directly on the compose network; nothing
# needs metrics through nginx (a private-range allow-list also let in requests
# that reached nginx via docker-proxy).
location /metrics {
  deny all;
}

location /api/ {
  limit_req zone=api burst=20 nodelay;
  proxy_pass http://api_gateway;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Gateway waits up to 90s on ai-rag (legacy /chat/completions too);
  # nginx's 60s default would 504 first.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}

# Full Quran translation payload used by the Kotlin offline reader.
location = /api/quran/verses {
  # Several MB per response and only fetched once per install: a tight limit
  # keeps it from being used to tie up ai-rag.
  limit_req zone=bulk burst=3 nodelay;
  proxy_pass http://ai_rag/quran/verses;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
}

# Remote lock-screen background assets.
location /backgrounds/ {
  alias /usr/share/nginx/html/backgrounds/;
  # expires sets Cache-Control: max-age. No add_header here: one would
  # drop the server-level security headers (and HSTS on HTTPS) here.
  expires 30d;
}

# Spiritual endpoint uchun qat'iy rate limit
# Recitation reports carry up to 15 minutes of raw audio (28.8 MB); the gateway
# enforces its own limit.
location = /api/v1/recitation/reports {
  client_max_body_size 30m;
  limit_req zone=api burst=5 nodelay;
  proxy_pass http://api_gateway;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_request_buffering off;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}

location /api/v1/spiritual/ {
  limit_req zone=spiritual burst=2 nodelay;
  proxy_pass http://api_gateway;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Gateway's RAG client timeout is 90s.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}

location /ws/ {
  limit_conn perip_ws 10;
  proxy_pass http://api_gateway;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  # The gateway pings every 25s, so this only bounds truly dead sockets.
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
}
