# Let's Encrypt HTTP-01 challenge files (certbot writes them into certbot_www).
# Served on BOTH :80 and :443 so renewal keeps working when a name is proxied
# through Cloudflare: in Full (strict) mode Cloudflare reaches the origin over
# :443, and Let's Encrypt follows the http->https redirect to get here.
location /.well-known/acme-challenge/ {
  root /var/www/certbot;
  default_type text/plain;
}
