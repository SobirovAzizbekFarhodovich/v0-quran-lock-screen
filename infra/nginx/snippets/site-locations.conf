# The noorain.uz website: a static single-page app (built from the Nur_website repo
# and copied to /opt/noorain/site on the server, see deploy/WEBSITE.md).
root /usr/share/nginx/site;
index index.html;

# Hashed build assets never change: cache them for a year.
location /assets/ {
  if ($site_to_https) { return 301 https://$host$request_uri; }
  # expires sets Cache-Control: max-age. No add_header here: one would drop the
  # server-level security headers (and HSTS) for every asset.
  expires 1y;
  try_files $uri =404;
}

# Client-side routes fall back to the app shell, which is never cached.
location / {
  if ($site_to_https) { return 301 https://$host$request_uri; }
  try_files $uri $uri/ /index.html;
  # Cache-Control: no-cache (again without add_header, see above).
  expires -1;
}

# The site's "ask the AI" box. Only this one API route is exposed on the site's own
# domain (same origin, so no CORS); the gateway limits it to 3 questions a day per IP.
location = /api/v1/public/ask {
  if ($site_to_https) { return 308 https://$host$request_uri; }
  limit_req zone=api burst=5 nodelay;
  client_max_body_size 8k;
  proxy_pass http://api_gateway;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}
