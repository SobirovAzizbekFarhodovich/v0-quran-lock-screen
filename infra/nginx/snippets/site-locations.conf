# The noorain.uz website: a static single-page app (built from the Nur_website repo
# and copied to /opt/noorain/site on the server, see deploy/WEBSITE.md).
root /usr/share/nginx/site;
index index.html;

# Hashed build assets never change: cache them for a year.
location /assets/ {
  if ($site_to_https) { return 301 https://$host$request_uri; }
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# Client-side routes fall back to the app shell, which is never cached.
location / {
  if ($site_to_https) { return 301 https://$host$request_uri; }
  try_files $uri $uri/ /index.html;
  add_header Cache-Control "no-cache";
}
