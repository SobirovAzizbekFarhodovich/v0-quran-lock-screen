# Security headers for every server. nginx drops inherited add_header
# directives in any location that sets its own, so locations in
# app-locations.conf must not use add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The old XSS auditor is gone from browsers and could itself be abused; "0" is
# the current recommendation.
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
