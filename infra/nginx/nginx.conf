events {
  worker_connections 1024;
}

http {
  # Gzip siqish
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Rate limiting zone
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=spiritual:10m rate=1r/s;

  upstream api_gateway {
    server api-gateway:8080;
  }

  server {
    listen 80;
    client_max_body_size 20m;

    # Xavfsizlik headerlari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /healthz {
      proxy_pass http://api_gateway/healthz;
    }

    location /metrics {
      # Faqat ichki tarmoqdan ruxsat
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://api_gateway/metrics;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spiritual endpoint uchun qat'iy rate limit
    location /api/v1/spiritual/ {
      limit_req zone=spiritual burst=2 nodelay;
      proxy_pass http://api_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
  }

  # ---- HTTPS konfiguratsiya (Let's Encrypt uchun tayyor) ----
  # Bu qismni HTTPS sozlagandan so'ng kommentdan chiqaring:
  #
  # server {
  #   listen 443 ssl http2;
  #   server_name yourdomain.com;
  #
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_prefer_server_ciphers on;
  #
  #   location / {
  #     proxy_pass http://api_gateway;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto https;
  #   }
  # }
}
