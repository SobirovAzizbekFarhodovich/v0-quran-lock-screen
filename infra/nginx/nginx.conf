worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;

  # Drop slow or idle clients early instead of letting them hold connections.
  client_header_timeout 10s;
  client_body_timeout 15s;
  keepalive_timeout 15s;
  send_timeout 30s;

  # File types for the website's static files (without this every file, the JS bundle
  # included, went out as text/plain and browsers refused to run it).
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Gzip siqish
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Rate limiting zone
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=spiritual:10m rate=1r/s;
  limit_req_zone $binary_remote_addr zone=bulk:10m rate=6r/m;
  # Open recitation sockets per IP (generous: several phones can share a
  # carrier-NAT address).
  limit_conn_zone $binary_remote_addr zone=perip_ws:10m;
  # Total concurrent connections per IP. Caps single-source connection floods
  # (a load test from one host reached CPU load ~2.9 with 800 conns); 200 is
  # far above any real browser, even many users sharing one carrier-NAT IP,
  # because HTTP/2 multiplexes requests onto few connections.
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream api_gateway {
    server api-gateway:8080;
  }

  upstream ai_rag {
    server ai-rag:8002;
  }

  # noorain.uz / www.noorain.uz: the website, not the API. Until the certificate
  # covers these names they are served over HTTP; afterwards HTTP redirects.
  server {
    listen 80;
    server_name noorain.uz www.noorain.uz;
    limit_conn perip 200;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/site-csp.conf;

    include /etc/nginx/snippets/acme-challenge.conf;

    set $site_to_https 0;
    include /etc/nginx/site-https.d/*.conf;
    include /etc/nginx/snippets/site-locations.conf;
  }

  server {
    # The API (and requests by IP / localhost, e.g. the deploy health gate) is the
    # default server for :80; without this nginx made the first block, the website, default.
    listen 80 default_server;
    client_max_body_size 20m;
    limit_conn perip 200;

    include /etc/nginx/snippets/security-headers.conf;

    # Let's Encrypt HTTP-01 challenges; the certbot service writes the tokens.
    include /etc/nginx/snippets/acme-challenge.conf;

    # Plain HTTP keeps serving the API: installed app builds still use
    # http://3.73.130.154. Redirect to HTTPS once every client has moved.
    include /etc/nginx/snippets/app-locations.conf;
  }

  # HTTPS server for $PUBLIC_HOST. 40-noorain-https.sh renders it from
  # templates/https.conf.template only when the certificate exists, so nginx
  # can start (and serve the ACME challenge) before the first issuance.
  include /etc/nginx/https.d/*.conf;
}
