name: islamic_ai_mobile
description: Cross-platform Islamic AI mobile client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Routing
  go_router: ^14.0.0

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.1

  # Networking
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.0.3

  # Audio
  record: ^6.1.2 # Keep record matching local third_party override
  audioplayers: ^6.0.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # Permissions
  permission_handler: ^11.3.1

  # UI/UX
  shimmer: ^3.0.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # i18n
  intl: ^0.19.0

  # Firebase & Analytics
  firebase_core: ^3.1.1
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.0.3
  firebase_messaging: ^15.0.3

dependency_overrides:
  record_android:
    path: third_party/record_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  injectable_generator: ^2.4.2
  flutter_gen: ^5.5.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri/Amiri-Bold.ttf
          weight: 700
