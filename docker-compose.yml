services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-islamic_ai}
      POSTGRES_USER: ${POSTGRES_USER:-islamic_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-islamic_ai} -d ${POSTGRES_DB:-islamic_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    # maxmemory: a hard ceiling (normal use is ~25 MB) so a flood of recitation
    # audio cannot push the 3.7 GB host into swap; noeviction keeps logout
    # blacklist entries from being silently dropped.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis-pass-change-me}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-pass-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    restart: unless-stopped
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma_data:/chroma/chroma

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  api-gateway:
    restart: unless-stopped
    build:
      context: ./backend/api-gateway
    env_file: .env
    environment:
      # Probed by GET /healthz/deep (model_loaded must be true).
      AI_RECITATION_URL: ${AI_RECITATION_URL:-http://ai-recitation:8001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-rag:
        condition: service_started
    volumes:
      # Audio users send with 'this result is wrong' reports.
      - recitation_reports:/data/recitation-reports
      # Profile photos (one JPEG per user).
      - avatars:/data/avatars

  ai-recitation:
    restart: unless-stopped
    build:
      context: ./ai/recitation
    env_file: .env
    # .env is shared; withhold the secrets this service never uses, so a bug in
    # the ML stack cannot leak the key that signs every login token.
    environment:
      JWT_SECRET: ""
      DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
      GRAFANA_PASSWORD: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    # Whisper weights (~460 MB for "small") survive rebuilds instead of re-downloading.
    volumes:
      - whisper_models:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

  ai-rag-init:
    build:
      context: ./ai/rag
    env_file: .env
    command: ["python", "-m", "scripts.build_chromadb", "--data-dir", "/app/data", "--chroma-host", "chromadb", "--chroma-port", "8000"]
    depends_on:
      chromadb:
        condition: service_started
    restart: "no"

  ai-rag:
    restart: unless-stopped
    build:
      context: ./ai/rag
    env_file: .env
    # See ai-recitation: secrets ai-rag never uses are withheld.
    environment:
      JWT_SECRET: ""
      DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
      GRAFANA_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      ai-rag-init:
        condition: service_completed_successfully

  nginx:
    restart: unless-stopped
    image: nginx:1.27-alpine
    environment:
      # Public hostname for HTTPS (also names the certificate). Default is the
      # sslip.io name that resolves to the server IP. Switch to a real domain
      # with infra/scripts/enable-domain.sh, or by setting PUBLIC_HOST (and
      # optionally EXTRA_HOSTS="noorain.uz,www.noorain.uz") in .env and running
      # `docker compose up -d --no-deps nginx certbot`; certbot then issues one
      # certificate covering all of them.
      PUBLIC_HOST: ${PUBLIC_HOST:-3-73-130-154.sslip.io}
      EXTRA_HOSTS: ${EXTRA_HOSTS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/nginx/templates:/etc/nginx/noorain-templates:ro
      - ./infra/nginx/40-noorain-https.sh:/docker-entrypoint.d/40-noorain-https.sh:ro
      - ./remote_backgrounds:/usr/share/nginx/html/backgrounds:ro
      # The noorain.uz website (static build, copied by deploy/deploy-website.sh).
      - ./site:/usr/share/nginx/site:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api-gateway

  # Issues and renews the Let's Encrypt certificate for PUBLIC_HOST over
  # HTTP-01 (nginx serves /.well-known/acme-challenge/ from certbot_www).
  # Certificates live in the letsencrypt volume, outside the rsynced tree.
  certbot:
    image: certbot/certbot:v5.8.0
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-3-73-130-154.sslip.io}
      EXTRA_HOSTS: ${EXTRA_HOSTS:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    entrypoint: ["/bin/sh", "/opt/noorain-certbot/certbot-loop.sh"]
    volumes:
      - ./infra/certbot:/opt/noorain-certbot:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - nginx
    restart: unless-stopped

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.1.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api-gateway

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.5.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  recitation_reports:
  avatars:
  whisper_models:
  postgres_data:
  redis_data:
  chroma_data:
  minio_data:
  prometheus_data:
  grafana_data:
  letsencrypt:
  certbot_www:
