services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-islamic_ai}
      POSTGRES_USER: ${POSTGRES_USER:-islamic_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-islamic_ai} -d ${POSTGRES_DB:-islamic_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis-pass-change-me}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-pass-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma_data:/chroma/chroma

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  api-gateway:
    build:
      context: ./backend/api-gateway
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-rag:
        condition: service_started

  ai-recitation:
    build:
      context: ./ai/recitation
    env_file: .env
    # Whisper weights (~460 MB for "small") survive rebuilds instead of re-downloading.
    volumes:
      - whisper_models:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

  ai-rag-init:
    build:
      context: ./ai/rag
    env_file: .env
    command: ["python", "-m", "scripts.build_chromadb", "--data-dir", "/app/data", "--chroma-host", "chromadb", "--chroma-port", "8000"]
    depends_on:
      chromadb:
        condition: service_started
    restart: "no"

  ai-rag:
    build:
      context: ./ai/rag
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      ai-rag-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # - "443:443"  # Uncomment for HTTPS
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./remote_backgrounds:/usr/share/nginx/html/backgrounds:ro
      # - ./infra/nginx/ssl:/etc/nginx/ssl:ro  # Uncomment for HTTPS
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  whisper_models:
  postgres_data:
  redis_data:
  chroma_data:
  minio_data:
  prometheus_data:
  grafana_data:
