name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ai/**"
      - "docker-compose.yml"
      - "infra/**"
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # The server has no git checkout: the backend tree is synced into /opt/noorain.
      # Its .env (generated secrets) and the Android/Flutter sources are never touched.
      - name: Sync backend code
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='/.git' --exclude='/.github' --exclude='/.env' --exclude='/.env.bak-*' --exclude='/site' --exclude='/.impeccable' \
            --exclude='/app' --exclude='/mobile' --exclude='/brand' --exclude='/gradle' \
            --exclude='/gradlew*' --exclude='/*.gradle.kts' --exclude='/gradle.properties' \
            --exclude='/backend/api-gateway/server' --exclude='__pycache__' --exclude='/build.log' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/noorain/"

      # ai-rag-init is skipped on purpose: the ChromaDB index is built offline and shipped
      # into the volume (a rebuild takes hours on the server's 2 CPUs). nginx is restarted
      # because it caches upstream container IPs and would 502 after the recreate.
      # "up nginx certbot" applies compose changes to them (ports, mounts). TLS
      # certificates live in the letsencrypt volume, so the rsync above never removes them.
      - name: Build and restart services
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/noorain
            sudo docker compose build api-gateway ai-rag ai-recitation
            sudo docker compose up -d --no-deps postgres redis chromadb
            sudo docker compose up -d --no-deps ai-rag ai-recitation api-gateway
            sudo docker compose up -d --no-deps nginx certbot
            sudo docker compose restart nginx
            sudo docker image prune -f
            sleep 15
            curl -fsS http://localhost/healthz
          '

      # /healthz only proves the gateway process is up. The deep check also requires
      # postgres, redis, ai-rag and a loaded recitation model; the model takes a while
      # to load after a recreate, so poll for up to ~4 minutes before failing the deploy.
      - name: Deep health check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            for attempt in $(seq 1 24); do
              if body=$(curl -fsS --max-time 20 http://localhost/healthz/deep); then
                echo "$body"
                exit 0
              fi
              echo "attempt $attempt: deep health degraded, retrying in 10s"
              sleep 10
            done
            echo "::error::deep health still degraded after deploy"
            curl -sS --max-time 20 http://localhost/healthz/deep
            exit 1
          '
