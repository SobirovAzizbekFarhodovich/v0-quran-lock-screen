name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  FLUTTER_VERSION: "3.24.5"
  PYTHON_VERSION: "3.11"

jobs:
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go vet ./...
      - name: Build
        run: go build -o /dev/null ./cmd/server
      - name: Test
        run: go test ./... -v -race -count=1

  flutter-mobile:
    name: Flutter Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  python-ai:
    name: Python AI Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai/recitation, ai/rag]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile app/*.py
      - run: python -m pytest -q

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [go-backend, flutter-mobile, python-ai]
    steps:
      - uses: actions/checkout@v4
      - name: Build API Gateway
        run: docker build -t islamic-ai/api-gateway ./backend/api-gateway
      - name: Build AI Recitation
        run: docker build -t islamic-ai/ai-recitation ./ai/recitation
      - name: Build AI RAG
        run: docker build -t islamic-ai/ai-rag ./ai/rag
