name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"
  FLUTTER_VERSION: "3.24.5"
  PYTHON_VERSION: "3.11"

jobs:
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go vet ./...
      - name: Build
        run: go build -o /dev/null ./cmd/server
      - name: Test
        run: go test ./... -v -race -count=1

  flutter-mobile:
    name: Flutter Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android-app:
    name: Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); no local.properties is needed,
      # the build falls back to defaults for SERVER_BASE_URL and the Google client id.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Lint (errors only)
        run: ./gradlew :app:lintDebug --stacktrace
        continue-on-error: true

  python-ai:
    name: Python AI Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai/recitation, ai/rag]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app/*.py
      - run: python -m pytest -q

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [go-backend, flutter-mobile, python-ai]
    steps:
      - uses: actions/checkout@v4
      - name: Build API Gateway
        run: docker build -t islamic-ai/api-gateway ./backend/api-gateway
      - name: Build AI Recitation
        run: docker build -t islamic-ai/ai-recitation ./ai/recitation
      - name: Build AI RAG
        run: docker build -t islamic-ai/ai-rag ./ai/rag
